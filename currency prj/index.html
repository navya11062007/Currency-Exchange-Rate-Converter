
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Exchange Converter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">↔</div>
            <h1>Currency Converter</h1>
            <p>Convert money between world currencies</p>
        </header>

        <main class="converter">
            <label for="amount">Enter Amount</label>
            <input type="number" id="amount" value="100" min="0"
                   step="any" placeholder="Enter amount">

            <div class="currency-row">
                <div class="currency-box">
                    <label for="fromCurrency">From</label>
                    <select id="fromCurrency">
                        <option value="USD">USD - US Dollar</option>
                        <option value="INR" selected>INR - Indian Rupee</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound</option>
                        <option value="JPY">JPY - Japanese Yen</option>
                        <option value="AUD">AUD - Australian Dollar</option>
                        <option value="CAD">CAD - Canadian Dollar</option>
                        <option value="SGD">SGD - Singapore Dollar</option>
                        <option value="AED">AED - UAE Dirham</option>
                        <option value="CHF">CHF - Swiss Franc</option>
                        <option value="CNY">CNY - Chinese Yuan</option>
                        <option value="KRW">KRW - South Korean Won</option>
                    </select>
                </div>

                <button id="swapButton" class="swap-button"
                        type="button" aria-label="Swap currencies">⇄</button>

                <div class="currency-box">
                    <label for="toCurrency">To</label>
                    <select id="toCurrency">
                        <option value="USD" selected>USD - US Dollar</option>
                        <option value="INR">INR - Indian Rupee</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound</option>
                        <option value="JPY">JPY - Japanese Yen</option>
                        <option value="AUD">AUD - Australian Dollar</option>
                        <option value="CAD">CAD - Canadian Dollar</option>
                        <option value="SGD">SGD - Singapore Dollar</option>
                        <option value="AED">AED - UAE Dirham</option>
                        <option value="CHF">CHF - Swiss Franc</option>
                        <option value="CNY">CNY - Chinese Yuan</option>
                        <option value="KRW">KRW - South Korean Won</option>
                    </select>
                </div>
            </div>

            <button id="convertButton" class="convert-button" type="button">
                Convert Currency
            </button>

            <section class="result" aria-live="polite">
                <p>Converted Amount</p>
                <h2 id="result">Enter an amount to convert</h2>
                <p id="rate">Exchange rate will appear here</p>
                <p id="updated"></p>
            </section>

            <p id="message" role="status"></p>
        </main>

        <footer>
            <p>Currency Converter Project | HTML, CSS & JavaScript</p>
            <p>Exchange rates are for reference only.</p>
        </footer>
    </div>
</body>
</html>
